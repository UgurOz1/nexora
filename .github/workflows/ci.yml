name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # Real Postgres and Redis for the integration tests, started next to the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexora:ci-password@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Generate Prisma client
        run: pnpm --filter @nexora/api prisma:generate

      # openapi.json is the contract the web client is generated from. If a controller or DTO
      # changed and the file was not regenerated, this fails with a diff.
      - name: API contract is up to date
        run: |
          pnpm --filter @nexora/api openapi:generate
          git diff --exit-code -- apps/api/openapi.json || {
            echo "::error::apps/api/openapi.json is out of date. Run: pnpm --filter @nexora/api openapi:generate"
            exit 1
          }

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --filter @nexora/api typecheck

      - name: Unit tests (with coverage)
        run: pnpm --filter @nexora/api test:cov

      # Creates a nexora_test database, applies the real migrations and runs the tenant
      # isolation and permission tests over HTTP.
      - name: Integration tests
        run: pnpm --filter @nexora/api test:e2e
