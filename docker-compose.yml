name: nexora

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

  # S3-compatible object storage for file attachments (ADR-0012). The API hands browsers signed
  # links to this address, and files go straight to it.
  storage:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - '8333:8333' # S3 API
    volumes:
      - storage-data:/data
    healthcheck:
      # The S3 API answers 403 to anonymous requests; any HTTP answer means it is up.
      test: ['CMD-SHELL', 'wget -S --spider -T 2 http://127.0.0.1:8333/ 2>&1 | grep -q "HTTP/"']
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  storage-data:
